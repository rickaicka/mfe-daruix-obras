name: Publicar imagem Docker - mfe-daruix-obras

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: deploy-obras-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  mfe-daruix-obras_NAME: rickaicka/mfe-daruix-obras

jobs:
  build-and-push:
    name: Build e publicacao
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.mfe-daruix-obras_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Compilar e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy VPS - obras
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar obras na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/daruix-hub
          compose=(docker compose -f compose.yml -f compose.front.yml)
          "${compose[@]}" config --services | grep -qx 'obras'
          "${compose[@]}" pull obras
          "${compose[@]}" up -d --no-deps --force-recreate obras
          container_id="$("${compose[@]}" ps -q obras)"
          test -n "$container_id"
          for attempt in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [ "$status" = running ] && [ "$health" = healthy ]; then
              echo 'Deploy obras concluido: container saudavel.'
              exit 0
            fi
            if [ "$status" = exited ] || [ "$status" = dead ]; then
              docker logs --tail 80 "$container_id" || true
              echo "Container parou: $status" >&2
              exit 1
            fi
            sleep 2
          done
          docker logs --tail 80 "$container_id" || true
          echo 'Timeout aguardando healthcheck do obras' >&2
          exit 1
          REMOTE
