name: Publicar imagem Docker - mfe-daruix-obras

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: deploy-obras-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OBRAS_IMAGE_NAME: rickaicka/mfe-daruix-obras

jobs:
  build-and-push:
    name: Build e publicacao
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OBRAS_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Compilar e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy VPS - obras
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo 'VPS_SSH_KEY vazio' >&2; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo 'VPS_KNOWN_HOSTS vazio' >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          echo 'Chave privada carregada e validada.'

      - name: Validar conexão SSH e acesso ao Docker
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          echo 'Testando autenticação SSH e execução remota...'
          ssh -vv \
            -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            'echo SSH_OK; id -un; hostname; docker --version; docker compose version'

      - name: Atualizar obras na VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo 'REMOTE_OK: iniciando deploy obras'
          cd /opt/daruix-hub
          compose=(docker compose -f compose.yml -f compose.front.yml)

          echo 'Validando configuração Compose'
          "${compose[@]}" config --quiet
          if ! "${compose[@]}" config --services | grep -Fxq 'obras'; then
            echo 'Serviço obras ausente no Compose' >&2
            exit 1
          fi

          echo 'Baixando imagem obras'
          "${compose[@]}" pull obras
          echo 'Recriando serviço obras'
          "${compose[@]}" up -d --no-deps --force-recreate obras

          container_id="$("${compose[@]}" ps -q obras)"
          if [ -z "$container_id" ]; then
            echo 'Container obras não foi encontrado após o deploy' >&2
            exit 1
          fi
          echo "Container encontrado: $container_id"
          for attempt in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            echo "Verificação $attempt/45: status=$status health=$health"
            if [ "$status" = running ] && [ "$health" = healthy ]; then
              echo 'Deploy obras concluído: container saudável.'
              exit 0
            fi
            if [ "$status" = exited ] || [ "$status" = dead ]; then
              docker logs --tail 80 "$container_id" || true
              echo "Container parou: $status" >&2
              exit 1
            fi
            sleep 2
          done
          docker logs --tail 80 "$container_id" || true
          echo 'Timeout aguardando healthcheck do obras' >&2
          exit 1
          REMOTE
