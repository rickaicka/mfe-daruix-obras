server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /remoteEntry.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~* \.(?:json|js|mjs|css|map|woff2?|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}
