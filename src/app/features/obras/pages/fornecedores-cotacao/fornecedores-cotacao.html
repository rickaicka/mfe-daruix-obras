<section class="quotation supplier-registry-list">
  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
  <drx-data-table title="Cadastro de Fornecedores" mode="server"
    [rows]="rows()" [columns]="columns" [actions]="actions"
    [total]="total()" [page]="page()" [pageSize]="20" [pageSizeOptions]="[20]"
    [loading]="busy()" [search]="search()" [columnFilters]="false"
    searchPlaceholder="Pesquisar fornecedor" emptyText="Nenhum fornecedor encontrado."
    primaryActionLabel="Novo fornecedor" [primaryActionDisabled]="busy()"
    (primaryAction)="newSupplier()" (queryChange)="updateQuery($event)"
    (rowAction)="rowAction($event)" />
</section>
